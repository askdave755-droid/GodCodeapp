  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If the JS bundle never executes at all, say so instead of showing a blank page.
      setTimeout(function () {
        var r = document.getElementById("root");
        if (r && r.children.length === 0) {
          r.innerHTML = '<div style="padding:24px;color:#d9b26a;font:13px monospace">App did not start — the JS bundle failed to load. Hard-refresh (clear cache) and check the browser console.</div>';
        }
      }, 3000);
    </script>
  </body>
