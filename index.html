<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060c1f" />
    <meta name="description" content="GodCode — Decode Your Identity. Discover God's Design." />
    <title>GodCode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      setTimeout(function () {
        var r = document.getElementById("root");
        if (!r || r.children.length > 0) return; // app is running — do nothing
        // Self-heal: stale cached HTML is the usual cause. Retry once with a cache-buster.
        if (!/[?&]cb=/.test(location.search)) {
          location.replace(location.pathname + "?cb=1");
          return;
        }
        // Retried and still dead — show exactly what this HTML is trying to load.
        var s = document.querySelector('script[type="module"]');
        r.innerHTML =
          '<div style="padding:24px;color:#ffb4a8;font:13px/1.6 monospace;word-break:break-all">' +
          "APP DID NOT START (retried with cache-buster)<br><br>" +
          "This HTML loads script:<br>" + (s ? s.src : "NONE FOUND") + "<br><br>" +
          "Send this screen to support." +
          "</div>";
      }, 4000);
    </script>
  </body>
</html>
